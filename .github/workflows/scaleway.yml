name: Deploy WordPress to Scaleway

on:
  push:
    branches: [ main ]

env:
  CONTAINER_ID: "${{ secrets.SCW_CONTAINER_ID }}"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Scaleway CLI
        run: |
          set -eux
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) SCW_ARCH="amd64" ;;
            aarch64|arm64) SCW_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/scaleway/scaleway-cli/releases/latest/download/scw-linux-${SCW_ARCH}" -o /tmp/scw
          sudo install -m 0755 /tmp/scw /usr/local/bin/scw
          scw --version

      - name: Log in to Scaleway Container Registry
        run: |
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin

      - name: Set up Docker image tag
        run: |
          TIMESTAMP=$(date +%d-%b-%Y__%H.%M.%S)
          IMAGE="rg.fr-par.scw.cloud/namespace-youthful-engelbart/my-wordpress-sqlite:$TIMESTAMP"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Build and push Docker image (with caching)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Update Scaleway Serverless Container
        run: |
          scw container container update \
            container-id=${{ env.CONTAINER_ID }} \
            image=${{ env.IMAGE }} \
            min-scale=0 \
            max-scale=1
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
